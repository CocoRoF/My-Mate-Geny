[project]
name = "hr-harnessor-backend"
version = "0.1.0"
description = "hr-harnessor — agent harness service backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=12",
    "cryptography>=42",
    "asyncssh>=2.14",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",  # multipart/form-data uploads (chat attachments)
    "psutil>=6",
    "httpx>=0.27",
    "mcp>=1.30,<2",              # managed stdio / Streamable HTTP / SSE MCP clients (stable v1 API)
    "uv>=0.13,<1",               # explicit, isolated MCP package installation; bundled on each desktop OS
    "pywinpty>=2; sys_platform == 'win32'",
    "tzdata>=2024.1; sys_platform == 'win32'",  # zoneinfo's IANA zones: Windows has none of its own (the mates' clock)
    "Pillow>=10.0",             # downscale image attachments for the model
    # API-key engines (app.harness): each vendor's official SDK, and PDFs for the Read tool
    "anthropic>=2.6,<3",
    "openai>=3.46,<4",
    "google-genai>=3.0,<4",
    "pypdf>=5",
    # local voice models (app/voicehost): audio in and out, and the Hugging Face downloads — the engines themselves
    # (torch, CUDA) live in environments of their own, installed on demand, never in this one
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.4",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60  # a test that hangs fails with its stack instead of holding up the whole run
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
