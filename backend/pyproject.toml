[project]
name = "hr-harnessor-backend"
version = "0.1.0"
description = "hr-harnessor — agent harness service backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=12",
    "cryptography>=42",
    "asyncssh>=2.14",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",  # multipart/form-data uploads (chat attachments)
    "Pillow>=10.0",             # downscale image attachments for the model
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
