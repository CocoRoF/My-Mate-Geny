# Backend tests + web console typecheck/build on every push and PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q -p no:cacheprovider -n auto

  # The app's stdio MCP servers on Windows, started as the app starts them (backend/tests/test_stdio_bridges.py): a pipe there
  # is the system's code page, not UTF-8. Stdlib + pytest only, no app import.
  bridges-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q -p no:cacheprovider --noconftest tests/test_stdio_bridges.py

  # The avatar pipeline runs in a venv of its own (app/avatar/deps.py), so the job above skips it: cut-outs are checked here.
  avatar-processing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: |
          python -m venv /tmp/avatar-venv
          /tmp/avatar-venv/bin/pip install "numpy<3" scipy "opencv-python-headless<5" pillow imageio-ffmpeg
          touch /tmp/avatar-venv/ready.json
      - run: python -m pytest -q -p no:cacheprovider tests/test_avatar.py -k "alpha_recovery or end_to_end or steady_edges or what_she_holds or loose_strand or edge_matte"
        env:
          AVATAR_TEST_VENV: /tmp/avatar-venv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p . --noEmit
      # the mate's reply rendering + speech preprocessing (node's test runner, TS types stripped)
      - run: npm run test:unit
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose -f deploy/docker-compose.yml config -q
