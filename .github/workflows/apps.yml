# Native apps: desktop (Windows / macOS / Linux, Electron) + Android (Capacitor).
# Both apps load the live console, so UI changes reach them without a new
# build; this pipeline rebuilds and publishes the app shells whenever they
# change (or on demand), and the console's Download page always serves the
# newest build from the rolling `apps-latest` release.
name: apps

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "mobile/**"
      - "assets/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps
  cancel-in-progress: true

env:
  VERSION: 0.2.${{ github.run_number }}

jobs:
  desktop:
    name: desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            build: npx electron-builder --linux AppImage deb --publish never
          - name: windows
            os: windows-latest
            build: npx electron-builder --win nsis --x64 --publish never
          - name: macos
            os: macos-latest
            build: npx electron-builder --mac dmg --arm64 --x64 --publish never
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build
        run: ${{ matrix.build }} -c.extraMetadata.version=${{ env.VERSION }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing identity: unsigned builds (+ ad-hoc on macOS)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - name: Release keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          KEYSTORE_B64: ${{ secrets.HRH_KEYSTORE_B64 }}
      - name: Build signed APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} -PversionName=${{ env.VERSION }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/hr-harnessor-${{ env.VERSION }}-android.apk"
        env:
          HRH_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          HRH_KEYSTORE_PASSWORD: ${{ secrets.HRH_KEYSTORE_PASSWORD }}
          HRH_KEY_ALIAS: ${{ secrets.HRH_KEY_ALIAS }}
          HRH_KEY_PASSWORD: ${{ secrets.HRH_KEY_PASSWORD }}
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/hr-harnessor-${{ env.VERSION }}-android.apk" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: hr-harnessor-*-android.apk

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la out
          prev=$(git tag --list 'apps-v*' --sort=-v:refname | head -1)
          {
            echo "<!-- hrh-meta $(jq -nc --arg v "$VERSION" --arg c "$GITHUB_SHA" --arg m "$(git log -1 --format=%s)" --arg d "$(date -u +%FT%TZ)" '{version:$v,commit:$c,commit_message:$m,built_at:$d}') -->"
            echo "Built from $(git rev-parse --short HEAD): $(git log -1 --format=%s)"
            echo
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              git log --no-merges --format='- %s (%h)' "$prev"..HEAD | head -40
            fi
          } > notes.md

          # Versioned release (history) …
          gh release create "apps-v$VERSION" out/* --title "Apps $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

          # … and the rolling one the Download page reads: updated in place so
          # downloads never disappear mid-swap.
          if gh release view apps-latest >/dev/null 2>&1; then
            git tag -f apps-latest "$GITHUB_SHA" && git push -f origin apps-latest
            gh release upload apps-latest out/* --clobber
            keep=$(cd out && ls)
            for a in $(gh release view apps-latest --json assets --jq '.assets[].name'); do
              echo "$keep" | grep -qx "$a" || gh release delete-asset apps-latest "$a" --yes
            done
            gh release edit apps-latest --title "Apps $VERSION (latest)" --notes-file notes.md
          else
            gh release create apps-latest out/* --title "Apps $VERSION (latest)" --notes-file notes.md --target "$GITHUB_SHA"
          fi

          # Keep the 5 newest versioned releases.
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^apps-v' | sort -V -r | tail -n +6); do
            gh release delete "$t" --yes --cleanup-tag
          done
