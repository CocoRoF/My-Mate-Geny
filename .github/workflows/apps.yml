# Native apps: desktop (Windows / macOS / Linux, Electron) + Android (Capacitor).
# Both apps load the live console, so UI changes reach them without a new
# build; this pipeline rebuilds and publishes the app shells whenever they
# change (or on demand). Builds upload straight to a GitHub Release (no
# Actions artifact storage); the console's Download page serves the rolling
# `apps-latest` release. Artifacts are named `my-mate-geny-<version>-…` since
# 0.3 (formerly `hr-harnessor-…`; backend/app/services/downloads.py matches
# both by suffix, so the swap is seamless).
name: apps

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "mobile/**"
      - "assets/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps
  cancel-in-progress: true

env:
  VERSION: 0.4.${{ github.run_number }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft release for this build
        run: gh release create "apps-v$VERSION" --draft --title "Apps $VERSION" --notes "Building…" --target "$GITHUB_SHA"

  desktop:
    name: desktop (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing identity: unsigned (+ ad-hoc on macOS)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Unit tests (server address + sign-in)
        if: matrix.name == 'linux'
        run: npm test
      - name: Build (linux)
        if: matrix.name == 'linux'
        run: npx electron-builder --linux AppImage deb --publish never -c.extraMetadata.version=$VERSION
      - name: Build (windows)
        if: matrix.name == 'windows'
        run: npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version=$VERSION
      - name: Build (macos)
        if: matrix.name == 'macos'
        run: |
          sudo mdutil -a -i off || true   # Spotlight indexing breaks dmg detach on runners
          # One arch at a time, each with its own volume name (they collide otherwise).
          npx electron-builder --mac dmg --arm64 --publish never -c.extraMetadata.version=$VERSION -c.dmg.title="my-mate-geny-arm64"
          npx electron-builder --mac dmg --x64 --publish never -c.extraMetadata.version=$VERSION -c.dmg.title="my-mate-geny-x64"
      # + the in-app updater's descriptions (electron-updater, generic provider — desktop/src/updater.js): latest.yml
      # (Windows) and latest-linux.yml, served to the app by the console's /api/downloads/update/. No latest-mac.yml:
      # unsigned macOS builds cannot replace themselves (the app offers the .dmg).
      - name: Upload to release
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb dist/latest.yml dist/latest-linux.yml)
          ls -la "${files[@]}"
          gh release upload "apps-v$VERSION" "${files[@]}" --clobber

  android:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The runner image ships the Android SDK (ANDROID_HOME, licenses
      # accepted); Gradle fetches the exact platform/build-tools it needs.
      - run: npm ci
      - run: npm test
      - run: npx cap sync android
      - name: Release keystore
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          KEYSTORE_B64: ${{ secrets.HRH_KEYSTORE_B64 }}
      - name: Build signed APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PhrhVersionCode=${{ github.run_number }} -PhrhVersionName=$VERSION
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/my-mate-geny-$VERSION-android.apk"
        env:
          HRH_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          HRH_KEYSTORE_PASSWORD: ${{ secrets.HRH_KEYSTORE_PASSWORD }}
          HRH_KEY_ALIAS: ${{ secrets.HRH_KEY_ALIAS }}
          HRH_KEY_PASSWORD: ${{ secrets.HRH_KEY_PASSWORD }}
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/my-mate-geny-$VERSION-android.apk" | head -3
      - name: Upload to release
        run: gh release upload "apps-v$VERSION" "$RUNNER_TEMP/my-mate-geny-$VERSION-android.apk" --clobber

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish
        run: |
          set -euo pipefail
          gh release download "apps-v$VERSION" -D out
          ls -la out
          prev=$(git tag --list 'apps-v*' --sort=-v:refname | head -1)
          {
            echo "<!-- hrh-meta $(jq -nc --arg v "$VERSION" --arg c "$GITHUB_SHA" --arg m "$(git log -1 --format=%s)" --arg d "$(date -u +%FT%TZ)" '{version:$v,commit:$c,commit_message:$m,built_at:$d}') -->"
            echo "Built from $(git rev-parse --short HEAD): $(git log -1 --format=%s)"
            echo
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              git log --no-merges --format='- %s (%h)' "$prev"..HEAD | head -40
            fi
          } > notes.md
          gh release edit "apps-v$VERSION" --draft=false --notes-file notes.md

          # The rolling release the Download page reads, updated in place so
          # downloads never disappear mid-swap.
          if gh release view apps-latest >/dev/null 2>&1; then
            git tag -f apps-latest "$GITHUB_SHA" && git push -f origin apps-latest
            gh release upload apps-latest out/* --clobber
            keep=$(cd out && ls)
            for a in $(gh release view apps-latest --json assets --jq '.assets[].name'); do
              echo "$keep" | grep -qx "$a" || gh release delete-asset apps-latest "$a" --yes
            done
            gh release edit apps-latest --title "Apps $VERSION (latest)" --notes-file notes.md
          else
            gh release create apps-latest out/* --title "Apps $VERSION (latest)" --notes-file notes.md --target "$GITHUB_SHA"
          fi

          # Keep the 5 newest versioned releases.
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^apps-v' | sort -V -r | tail -n +6); do
            gh release delete "$t" --yes --cleanup-tag
          done

  cleanup:
    needs: [desktop, android, publish]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Drop the unfinished draft
        run: gh release delete "apps-v$VERSION" --yes --repo "$GITHUB_REPOSITORY" || true
