# The in-app update on Windows, end to end with the real NSIS installers (desktop/test/e2e/windows-update-e2e.js):
# an older build installed as a user installs it, one press of Download & install, and the newer build must be the
# one running afterwards — in Local execution (the bundled backend running from the folder being replaced) and on the
# connect screen. Two versions of the same commit are built; they are cached by the sources they come from, so a
# change to the test alone does not build them again. Run by hand with two release tags (older, newer), the published
# installers themselves are checked instead: what a user on the older one gets, and the newer one installed fresh.
# A Windows runner for ~40 min, so only when it is wanted (2026-11-20, the owner: Actions use was far too high;
# .github/scripts/ci_gate.py heavy decides): weekly (Sundays 19:17 UTC) when the update's code changed since it last ran
# on main — it changes most days; on a pull request that changes it only with the label ci:windows (added later: re-run
# the PR's windows-update); on a push to an e2e/windows-update… branch; by hand.
name: windows-update

on:
  schedule:
    - cron: "17 19 * * 0"
  pull_request:
    paths:
      - "desktop/src/updater.js"
      - "desktop/src/main.js"
      - "desktop/src/quit.js"
      - "desktop/src/local-runtime.js"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "desktop/test/e2e/windows-update-e2e.js"
      - "desktop/test/e2e/windows-local-e2e.js"
      - ".github/workflows/windows-update.yml"
  push:
    branches: ["e2e/windows-update**"]
  workflow_dispatch:
    inputs:
      older:
        description: "Release tag of the older installer (e.g. apps-v0.4.103); empty: build both from this commit"
        default: ""
      newer:
        description: "Release tag of the newer installer (e.g. apps-v0.4.106)"
        default: ""
      rounds:
        description: "Updates per mode"
        default: "3"

permissions:
  contents: read
  actions: read # (when it last ran)
  pull-requests: read # (a PR's labels)

concurrency:
  group: windows-update-${{ github.ref }}
  cancel-in-progress: true

env:
  LOCAL_PYTHON_VERSION: '3.12.16'
  UV_VERSION: '0.13.6'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # (what changed since it last ran)
          filter: blob:none
      - id: gate
        run: >
          python3 .github/scripts/ci_gate.py heavy ci:windows
          desktop/src/updater.js desktop/src/main.js desktop/src/quit.js desktop/src/local-runtime.js
          desktop/package.json desktop/package-lock.json
          desktop/test/e2e/windows-update-e2e.js desktop/test/e2e/windows-local-e2e.js
        env:
          GH_TOKEN: ${{ github.token }}

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: The published installers (release check)
        if: inputs.newer != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in old:${{ inputs.older }} new:${{ inputs.newer }}; do
            gh release download "${d#*:}" --repo "$GITHUB_REPOSITORY" -p '*-windows-x64-setup.exe' -p 'latest.yml' -D "desktop/dist-${d%%:*}"
          done
          ls -la desktop/dist-old desktop/dist-new
      - name: The two installers (cached by their sources)
        if: inputs.newer == ''
        id: installers
        uses: actions/cache/restore@v4
        with:
          path: |
            desktop/dist-old/*.exe
            desktop/dist-old/*.yml
            desktop/dist-new/*.exe
            desktop/dist-new/*.yml
            desktop/dist-new/*.blockmap
          key: windows-update-${{ hashFiles('desktop/src/**', 'desktop/build/**', 'desktop/package.json', 'desktop/package-lock.json', 'backend/**', 'frontend/src/**', 'frontend/index.html', 'frontend/package-lock.json', 'frontend/vite.config.*') }}
      - run: npm ci --prefix desktop --no-audit --no-fund
      - name: Build an older and a newer installer
        if: inputs.newer == '' && steps.installers.outputs.cache-hit != 'true'
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          (cd frontend && npx vite build --outDir dist-local --emptyOutDir)
          cd desktop
          BUILD_COMMIT=$GITHUB_SHA python build/local-runtime.py --python-version "$LOCAL_PYTHON_VERSION"
          for v in old:0.9.1 new:0.9.2; do
            npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version=${v#*:} -c.directories.output=dist-${v%%:*}
            rm -rf dist-${v%%:*}/win-unpacked
          done
          ls -la dist-old dist-new
      # (saved now, not at the end: a failing test does not build them again)
      - name: Keep the installers
        if: inputs.newer == '' && steps.installers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            desktop/dist-old/*.exe
            desktop/dist-old/*.yml
            desktop/dist-new/*.exe
            desktop/dist-new/*.yml
            desktop/dist-new/*.blockmap
          key: ${{ steps.installers.outputs.cache-primary-key }}
      - name: Local execution (remembered; her videos play)
        working-directory: desktop
        run: node test/e2e/windows-local-e2e.js dist-new --out e2e-out
      - name: One press of Download & install
        if: success() || failure()
        working-directory: desktop
        env:
          # (the app's update source reads the release list from the GitHub API on the way: no anonymous rate limit)
          GH_TOKEN: ${{ github.token }}
        run: node test/e2e/windows-update-e2e.js dist-old dist-new --rounds "${{ inputs.rounds || '3' }}" --modes local,server --out e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-e2e
          path: desktop/e2e-out
          if-no-files-found: ignore
