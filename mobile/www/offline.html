<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hr·harnessor — offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0c10;color:#e6e9f0;font:15px system-ui,sans-serif;padding:24px;box-sizing:border-box}
  .card{max-width:340px;text-align:center}
  .logo{width:52px;height:52px;margin:0 auto 16px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#6e8bff,#22d3ee)}
  h1{font-size:17px;margin:0 0 8px} p{color:#9aa3b4;line-height:1.5;margin:0}
  button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#6e8bff,#5b7cff);color:#fff;font:inherit;font-weight:600}
</style></head>
<body><div class="card">
  <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg></div>
  <h1>Can't reach the console</h1>
  <p>Check your connection. The app reconnects automatically.</p>
  <button onclick="location.href='https://agent.hrletsgo.me/'">Retry</button>
</div>
<script>window.addEventListener("online", () => location.href = "https://agent.hrletsgo.me/");</script>
</body></html>
