# My Mate Geny — quick start on any machine with Docker:
#
#   cp .env.example .env                    # optional: compose-level knobs
#   cp backend/.env.example backend/.env    # optional: app settings
#   docker compose up -d
#   open http://localhost:8080              # first login: admin / geny-admin
#
# Everything the server keeps (database, vault + session keys, CLI logins of
# pooled accounts, mates, uploads, cloned repos) lives in the `geny-home`
# volume, mounted as the container user's home (/home/geny). Back it up; delete
# it to start over. Production / reverse proxy / tunnel: docs/deploy.md.

name: my-mate-geny

services:
  geny:
    build:
      context: .
      args:
        GENY_UID: ${GENY_UID:-1000}
        GENY_GID: ${GENY_GID:-1000}
    image: my-mate-geny:local
    init: true
    env_file:
      - path: backend/.env
        required: false
    environment:
      # auto: the login cookie is Secure exactly when the request came over
      # https (reverse proxy / tunnel), so plain-http LAN access works too.
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    ports:
      # Bound to localhost by default. Set GENY_BIND=0.0.0.0 to reach it from
      # your LAN (then prefer HTTPS in front of it, see docs/deploy.md).
      - "${GENY_BIND:-127.0.0.1}:${GENY_PORT:-8080}:8080"
    volumes:
      - geny-home:/home/geny
      # Folders the agents work in. Unset = a docker volume; set
      # GENY_WORKSPACES=/path/on/host (owned by GENY_UID) to use host folders.
      - ${GENY_WORKSPACES:-geny-workspaces}:/workspaces
      # Optional: reuse the Claude / Codex CLI logins of your host user
      # instead of logging in from the console (Providers).
      # Run `claude` / `codex login` on the host first so these exist.
      # - ${HOME}/.claude:/home/geny/.claude
      # - ${HOME}/.claude.json:/home/geny/.claude.json
      # - ${HOME}/.codex:/home/geny/.codex
      # Optional: an SSH key for remote workspaces / private git remotes.
      # - ${HOME}/.ssh:/home/geny/.ssh:ro
    restart: unless-stopped

volumes:
  geny-home:
  geny-workspaces:
