# nginx in front of My Mate Geny (TLS terminated here). Replace the hostname
# and certificate paths. The backend serves the console, API, WebSockets and
# login on one origin, so a single location is enough.
server {
    listen 443 ssl;
    http2 on;
    server_name geny.example.com;

    ssl_certificate     /etc/letsencrypt/live/geny.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geny.example.com/privkey.pem;

    client_max_body_size 600m;   # attachments / mate imports

    location / {
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;
        # Keep the public Host (same-origin checks) and the client IP (login bans).
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        # WebSockets (chat streams) and long agent turns.
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_request_buffering off;
    }
}

# Needed once in the http {} context for the Connection header above:
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name geny.example.com;
    return 301 https://$host$request_uri;
}
