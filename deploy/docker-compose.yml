# My Mate Geny — production-style example (HTTPS in front, persistent state).
#
#   cd deploy
#   cp .env.example .env            # set GENY_UID/GID, GENY_WORKSPACES, tunnel token...
#   docker compose up -d                       # behind your own reverse proxy
#   docker compose --profile tunnel up -d      # or with a Cloudflare tunnel
#
# Same image as the root docker-compose.yml (built from the repo root). The
# console listens on 127.0.0.1:${GENY_PORT} only, for a reverse proxy on this
# host (Caddy / nginx examples in deploy/examples/); the optional `tunnel`
# service reaches it over the compose network instead. See docs/deploy.md.
#
# Machine-specific changes (extra mounts, a different user/home, ...) belong in
# a docker-compose.override.yml next to this file (gitignored, merged
# automatically by `docker compose`).

name: my-mate-geny

services:
  geny:
    build:
      context: ..
      args:
        GENY_UID: ${GENY_UID:-1000}
        GENY_GID: ${GENY_GID:-1000}
    image: my-mate-geny:local
    init: true
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}     # auto = Secure on https requests
    ports:
      - "127.0.0.1:${GENY_PORT:-8080}:8080"
    volumes:
      - ${GENY_HOME:-geny-home}:/home/geny
      - ${GENY_WORKSPACES:-geny-workspaces}:/workspaces
      # Optional: the host user's CLI logins and SSH key (see docs/deploy.md).
      # - ${HOME}/.claude:/home/geny/.claude
      # - ${HOME}/.claude.json:/home/geny/.claude.json
      # - ${HOME}/.codex:/home/geny/.codex
      # - ${HOME}/.ssh:/home/geny/.ssh:ro
    restart: unless-stopped

  # Cloudflare tunnel (remotely managed): create a tunnel in the Cloudflare
  # dashboard, add a public hostname -> http://geny:8080, put its token in
  # CLOUDFLARE_TUNNEL_TOKEN. Started only with `--profile tunnel`.
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [geny]
    restart: unless-stopped

volumes:
  geny-home:
  geny-workspaces:
