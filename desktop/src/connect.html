<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Connect — My Mate Geny</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0c10;color:#e6e9f0;font:14px Inter,system-ui,sans-serif;padding:24px}
  .card{width:100%;max-width:400px;padding:28px;border:1px solid #232936;border-radius:18px;background:#161a22}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .head img{width:56px;height:56px;border-radius:14px;flex:none}
  h1{font-size:18px;margin:0 0 3px} .sub{color:#9aa3b4;font-size:13px;margin:0}
  label{display:block;font-size:12px;color:#9aa3b4;margin:0 0 6px}
  .modes{display:flex;gap:6px;margin-bottom:18px;background:#0f1218;padding:4px;border-radius:12px}
  .modes button{flex:1;padding:10px;border:0;border-radius:9px;background:transparent;color:#9aa3b4;cursor:pointer;font:inherit}
  .modes button[aria-selected=true]{background:#5b7cff;color:white}
  #localIntro{line-height:1.65;color:#9aa3b4;margin:0 0 20px}
  .field{margin-bottom:14px}
  input[type=text],input[type=password],input[type=url]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #232936;background:#0f1218;color:#e6e9f0;font:inherit;outline:none}
  input:focus{border-color:#5b7cff;box-shadow:0 0 0 3px rgba(91,124,255,.18)}
  input[aria-invalid=true]{border-color:#f87171}
  .hint{font-size:12px;color:#5e6676;margin-top:6px}
  .pw{position:relative} .pw input{padding-right:64px}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:5px 8px;border-radius:8px;border:0;background:#1c212c;color:#9aa3b4;font:inherit;font-size:12px;cursor:pointer}
  .check{display:flex;align-items:center;gap:8px;color:#9aa3b4;font-size:13px;margin:4px 0 18px;cursor:pointer}
  .check input{accent-color:#5b7cff;width:16px;height:16px;margin:0}
  .row{display:flex;gap:8px}
  button.primary,button.ghost{flex:1;padding:11px 14px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer}
  .primary{background:linear-gradient(135deg,#6e8bff,#5b7cff);color:#fff} .primary:disabled{opacity:.6;cursor:default}
  .ghost{background:#1c212c;color:#9aa3b4;flex:0 0 auto!important}
  .status{min-height:20px;margin-top:14px;font-size:13px;color:#9aa3b4;display:flex;gap:8px;align-items:flex-start}
  .status.err{color:#fca5a5} .status.ok{color:#86efac}
  .status small{display:block;color:#7c8597;margin-top:2px;word-break:break-word}
  .spin{width:14px;height:14px;margin-top:2px;border-radius:50%;border:2px solid #39415a;border-top-color:#6e8bff;animation:r .8s linear infinite;flex:none}
  @keyframes r{to{transform:rotate(360deg)}}
  .notice{font-size:13px;color:#9aa3b4;background:#11151d;border:1px solid #232936;border-radius:10px;padding:8px 10px;margin-bottom:16px}
  [hidden]{display:none!important}
  /* light: the console's Appearance (theme.js sets nativeTheme, which this media query follows) */
  @media (prefers-color-scheme: light) {
    :root{color-scheme:light}
    body{background:#f1f3f7;color:#161a23}
    .card{background:#fff;border-color:#dce0e8;box-shadow:0 1px 3px rgba(16,24,40,.06),0 18px 50px -24px rgba(16,24,40,.25)}
    .sub,label,.check,.status{color:#474f5f}
    input[type=text],input[type=password],input[type=url]{background:#f8f9fb;border-color:#c2c8d4;color:#161a23}
    input:focus{border-color:#3d5ae6;box-shadow:0 0 0 3px rgba(61,90,230,.18)}
    input[aria-invalid=true]{border-color:#b41a22}
    .hint{color:#606879}
    .modes{background:#ebeef3}.modes button{color:#474f5f}#localIntro{color:#606879}
    .pw button,.ghost{background:#ebeef3;color:#474f5f}
    .check input{accent-color:#3d5ae6}
    .primary{background:linear-gradient(135deg,#4c68f0,#3a56de)}
    .status.err{color:#b41a22} .status.ok{color:#046644}
    .status small{color:#606879}
    .spin{border-color:#c2c8d4;border-top-color:#3d5ae6}
    .notice{color:#474f5f;background:#f8f9fb;border-color:#dce0e8}
  }
</style></head>
<body>
<form class="card" id="form" novalidate autocomplete="on">
  <div class="head">
    <img src="logo.png" alt="">
    <div><h1 id="heading">Connect to your server</h1><p class="sub">My Mate Geny <span id="ver"></span></p></div>
  </div>
  <div class="modes" role="tablist" aria-label="실행 방식">
    <button type="button" id="modeLocal" role="tab" aria-selected="true">로컬 실행</button>
    <button type="button" id="modeServer" role="tab" aria-selected="false">서버 접속</button>
  </div>
  <p id="localIntro">이 컴퓨터에서 실행합니다. 별도의 Geny 로그인 없이 로컬 폴더와 설치된 Claude Code·Codex를 사용할 수 있습니다.</p>
  <div class="notice" id="notice" hidden></div>
  <div id="serverFields" hidden>
  <div class="field">
    <label for="server" id="serverLabel">Server address</label>
    <input id="server" name="server" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="example.com or 192.168.0.10:58080" autocomplete="url">
    <div class="hint" id="serverHint">The address of your My Mate Geny server — https:// is tried first.</div>
  </div>
  <div class="field">
    <label for="username" id="usernameLabel">Username</label>
    <input id="username" name="username" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username">
  </div>
  <div class="field">
    <label for="password" id="passwordLabel">Password</label>
    <div class="pw">
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="button" id="show" aria-pressed="false">Show</button>
    </div>
  </div>
  <label class="check"><input type="checkbox" id="remember" checked> <span id="rememberText">Remember the server and username (never the password)</span></label>
  </div>
  <div class="row">
    <button type="button" class="ghost" id="cancel" hidden>Back</button>
    <button type="submit" class="primary" id="go">Connect</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</form>
<script>
  const $ = (id) => document.getElementById(id);
  const api = window.hrhConnect;
  // the app's language (i18n.js through the preload); the English in the markup is the fallback
  const W = (window.hrhNative && window.hrhNative.text) || {};
  const say = (k, en, vars) => String(typeof W[k] === "string" ? W[k] : en).replace(/\{(\w+)\}/g, (a, n) => (vars && n in vars ? vars[n] : a));
  // connect-core.js's failures: the headline in this language by kind (the technical detail stays as it is)
  const why = (r) => (r && r.kind ? say("err_" + r.kind, r.message) : say("wrong", "Something went wrong"));
  if (window.hrhNative && window.hrhNative.language) document.documentElement.lang = window.hrhNative.language;
  if (W.connectTitle) document.title = W.connectTitle;
  for (const [id, key] of [["heading", "connectHeading"], ["modeLocal","modeLocal"], ["modeServer","modeServer"], ["localIntro","localIntro"], ["serverLabel", "serverLabel"], ["serverHint", "serverHint"], ["usernameLabel", "usernameLabel"],
    ["passwordLabel", "passwordLabel"], ["rememberText", "remember"], ["show", "show"], ["cancel", "back"], ["go", "connect"]]) {
    if (typeof W[key] === "string") $(id).textContent = W[key];
  }
  if (typeof W.serverPlaceholder === "string") $("server").placeholder = W.serverPlaceholder;
  const q = new URLSearchParams(location.search);
  let busy = false, mode="local";
  function choose(value){
    if(busy)return;mode=value;
    $("modeLocal").setAttribute("aria-selected",String(mode==="local"));
    $("modeServer").setAttribute("aria-selected",String(mode==="server"));
    $("serverFields").hidden=mode!=="server";$("localIntro").hidden=mode!=="local";
    $("heading").textContent=mode==="local"?say("localHeading","Start on this computer"):say("connectHeading","Connect to your server");
    $("go").textContent=mode==="local"?say("localStart","Start"):say("connect","Connect");status("","");
  }
  $("modeLocal").onclick=()=>choose("local");$("modeServer").onclick=()=>choose("server");
  // Arrow keys select tabs; each mode has its own clear primary action.
  document.querySelector('.modes').onkeydown=e=>{if(["ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();choose(mode==="local"?"server":"local");$(mode==="local"?"modeLocal":"modeServer").focus();}};

  function status(kind, text, detail) {
    const el = $("status");
    el.className = "status" + (kind === "err" ? " err" : kind === "ok" ? " ok" : "");
    el.textContent = "";
    if (kind === "busy") {
      const s = document.createElement("span");
      s.className = "spin";
      el.appendChild(s);
    }
    const box = document.createElement("div");
    box.textContent = text || "";
    if (detail) {
      const d = document.createElement("small");
      d.textContent = detail;
      box.appendChild(d);
    }
    el.appendChild(box);
  }
  function setBusy(on) {
    busy = on;
    $("go").disabled = on;
    $("modeLocal").disabled=on;$("modeServer").disabled=on;
    for (const id of ["server", "username", "password"]) $(id).readOnly = on;
  }
  function mark(id) {
    for (const f of ["server", "username", "password"]) $(f).setAttribute("aria-invalid", String(f === id));
    if (id) {
      $(id).focus();
      $(id).select();
    }
  }

  $("show").onclick = () => {
    const p = $("password");
    const show = p.type === "password";
    p.type = show ? "text" : "password";
    $("show").textContent = show ? say("hide", "Hide") : say("show", "Show");
    $("show").setAttribute("aria-pressed", String(show));
    p.focus();
  };
  $("cancel").onclick = async () => {if(busy&&mode==="local"){await api.cancelLocal();setBusy(false);status("","");}else api.cancel();};

  $("form").onsubmit = async (ev) => {
    ev.preventDefault();
    if (busy || !api) return;
    if(mode==="local"){
      setBusy(true);$("cancel").hidden=false;
      status("busy",say("localPreparing","Starting local execution…"));
      try{const r=await api.startLocal();if(!r?.ok)status("err",say("localFailed","Local execution could not start."),r?.message||"");}
      catch(e){status("err",say("localFailed","Local execution could not start."),e.message);}
      finally{setBusy(false);}return;
    }
    const input = $("server").value.trim();
    const username = $("username").value.trim();
    const password = $("password").value;
    if (!input) return status("err", say("enterServer", "Enter your server's address")), mark("server");
    if (!username) return status("err", say("enterUsername", "Enter your username")), mark("username");
    if (!password) return status("err", say("enterPassword", "Enter your password")), mark("password");
    mark(null);
    setBusy(true);
    try {
      status("busy", say("looking", "Looking for the server…"));
      const found = await api.findServer(input);
      if (!found || !found.ok) {
        status("err", why(found), found && found.detail);
        return mark(found && found.kind === "rate" ? null : "server");
      }
      $("server").value = found.server;
      status("busy", say("signingIn", "Signing in to {server}…", { server: found.server }));
      const r = await api.signIn({ server: found.server, username, password, remember: $("remember").checked });
      if (!r || !r.ok) {
        status("err", why(r), r && r.detail);
        return mark(r && (r.kind === "credentials" || r.kind === "missing_password") ? "password" : null);
      }
      $("password").value = "";
      status("busy", say("opening", "Opening the console…"));
      return; // the window navigates to the server
    } catch (e) {
      status("err", say("wrong", "Something went wrong"), String((e && e.message) || e));
    } finally {
      setBusy(false);
    }
  };

  (async () => {
    if (!api) return status("err", say("onlyInApp", "This page only works inside the My Mate Geny app."));
    const s = (await api.state()) || {};
    $("ver").textContent = s.version ? "· " + s.version : "";
    $("server").value = s.mode==="local"?(s.lastServer||""):(s.server || s.lastServer || "");
    choose(s.mode==="server"||!s.localAvailable?"server":"local");
    if(!s.localAvailable){$("modeLocal").disabled=true;$("modeLocal").title=say("localMissing","Install the complete desktop app to use Local execution.");}
    $("username").value = s.username || "";
    $("remember").checked = s.remember !== false;
    $("cancel").hidden = !s.server;
    const notice = q.get("notice");
    if(notice==="local-failed"){status("err",say("localInterrupted","Local execution stopped. Press Start to try again."));}
    if (notice === "signed-out") {
      $("notice").textContent = say("signedOut", "You're signed out.");
      $("notice").hidden = false;
    }
    if(mode==="local")$("go").focus();else ($("server").value ? ($("username").value ? $("password") : $("username")) : $("server")).focus();
  })();
</script></body></html>
