<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>My Mate Geny</title>
    <link rel="stylesheet" href="bar.css" />
  </head>
  <body>
    <div class="tip" id="tip" hidden></div>
    <div class="bar" id="bar" role="toolbar" aria-label="Mate">
      <button type="button" data-act="chat"></button>
      <button type="button" data-act="quick"></button>
      <i class="div"></i>
      <button type="button" data-act="screen"></button>
      <button type="button" data-act="through"></button>
      <button type="button" data-act="move"></button>
      <button type="button" data-act="hide"></button>
      <i class="div"></i>
      <button type="button" data-act="console"></button>
    </div>
    <script src="bar.js"></script>
  </body>
</html>
