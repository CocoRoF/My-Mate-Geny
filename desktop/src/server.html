<!doctype html>
<html><head><meta charset="utf-8"><title>Server</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  body{margin:0;padding:20px;background:#0a0c10;color:#e6e9f0;font:14px Inter,system-ui,sans-serif}
  label{font-size:12px;color:#9aa3b4} input{width:100%;box-sizing:border-box;margin:8px 0 14px;padding:10px 12px;border-radius:10px;border:1px solid #232936;background:#0f1218;color:#e6e9f0;font:inherit}
  .row{display:flex;gap:8px;justify-content:flex-end} button{padding:8px 14px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer}
  .primary{background:linear-gradient(135deg,#6e8bff,#5b7cff);color:#fff} .ghost{background:#1c212c;color:#9aa3b4}
</style></head>
<body>
  <label>Console server URL</label>
  <input id="u" autofocus>
  <div class="row"><button class="ghost" onclick="window.close()">Cancel</button><button class="primary" id="ok">Save</button></div>
<script>
  const u = document.getElementById("u");
  u.value = new URLSearchParams(location.search).get("server") || "";
  const save = async () => { if (await window.hrhNative.setServer(u.value.trim())) window.close(); };
  document.getElementById("ok").onclick = save;
  u.onkeydown = (e) => e.key === "Enter" && save();
</script></body></html>
