<!doctype html>
<html><head><meta charset="utf-8"><title>My Mate Geny — offline</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#0a0c10;color:#e6e9f0;font:14px Inter,system-ui,sans-serif}
  .card{width:380px;padding:28px;border:1px solid #232936;border-radius:16px;background:#161a22;text-align:center}
  .logo{width:56px;height:56px;margin:0 auto 12px;border-radius:14px;display:block}
  h1{font-size:16px;margin:0 0 6px} p{color:#9aa3b4;margin:0 0 6px;line-height:1.5} code{color:#5e6676;font-size:12px;word-break:break-all}
  .row{display:flex;gap:8px;justify-content:center;margin-top:18px}
  button{padding:9px 14px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer}
  .primary{background:linear-gradient(135deg,#6e8bff,#5b7cff);color:#fff} .ghost{background:#1c212c;color:#9aa3b4}
</style></head>
<body><div class="card">
  <img class="logo" src="logo.png" alt="">
  <div style="font-size:12px;color:#9aa3b4;margin:0 0 6px">My Mate Geny</div>
  <h1>Can't reach the server</h1>
  <p>Check your connection — the console will load as soon as it's reachable.</p>
  <code id="srv"></code>
  <div class="row"><button class="primary" id="retry">Retry</button><button class="ghost" id="change">Switch server</button></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("srv").textContent = (q.get("server") || "") + (q.get("error") ? "  ·  " + q.get("error") : "");
  document.getElementById("retry").onclick = () => window.hrhNative.retry();
  document.getElementById("change").onclick = () => window.hrhNative.switchServer();
  setInterval(() => navigator.onLine && window.hrhNative.retry(), 15000);
</script></body></html>
